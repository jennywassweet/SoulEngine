[project]
name = "soulengine"
version = "0.1.0"
description = "Autonomous AI character engine"
requires-python = ">=3.12"
dependencies = [
    "mistralai>=2.0",  # v2 moved Mistral out of the package root; see CLAUDE.md
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "aiosqlite>=0.19.0",
    "aiogram>=3.0.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "soul"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
